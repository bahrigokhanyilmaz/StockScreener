[pytest]
# Test discovery limited to the tests/ dir so the ad-hoc scripts/test_*.py
# (which hit live APIs) are NOT collected.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: fast isolated unit tests (no network, no AWS)
    integration: cross-step invariants using mocked AWS/HTTP
    regression: reproduces a specific past production bug
